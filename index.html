
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee Management System</title>
<style>
:root{--primary:#2563eb;--bg:#f4f6fb;--text:#1e293b;--muted:#64748b;--border:#e2e8f0}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}
header{background:#fff;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--border)}
header h2{margin:0;font-size:21px}
nav{display:flex;gap:8px;flex-wrap:wrap}
button,select,input{font:inherit}
button{border:0;border-radius:8px;padding:10px 14px;cursor:pointer;background:#e8eefc;color:#1e40af}
button:hover{filter:brightness(.96)}
button.primary{background:var(--primary);color:white}
button.danger{background:#fee2e2;color:#b91c1c}
button.active{background:var(--primary);color:white}
main{max-width:1200px;margin:24px auto;padding:0 16px}
.page{display:none}
.page.active{display:block}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin:18px 0}
.card,.panel{background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px}
.card small{color:var(--muted)}
.card h2{margin:10px 0 0;font-size:27px}
.panel{margin:16px 0;overflow-x:auto}
.panel h3{margin-top:0}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0}
.toolbar input,.toolbar select,.form-grid input,.form-grid select{padding:10px;border:1px solid var(--border);border-radius:8px;background:white;min-width:0}
.month-label{font-weight:bold;min-width:140px;text-align:center}
table{border-collapse:collapse;width:100%;min-width:700px}
th,td{padding:11px 10px;text-align:left;border-bottom:1px solid var(--border);font-size:14px}
th{background:#f8fafc;color:#475569}
td select{padding:7px;border:1px solid var(--border);border-radius:6px;max-width:150px}
.status{font-weight:bold;color:#334155}
.muted{color:var(--muted)}
.badge{display:inline-block;padding:4px 8px;border-radius:20px;background:#eef2ff;color:#3730a3;font-size:12px}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:10;align-items:center;justify-content:center;padding:15px}
.modal.show{display:flex}
.modal-box{background:white;border-radius:14px;padding:22px;width:min(520px,100%);max-height:90vh;overflow:auto}
.modal-box h2{margin-top:0}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:#475569}
.form-grid input,.form-grid select{width:100%}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.summary-line{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border)}
.total{font-size:20px;font-weight:bold}
.empty{text-align:center;padding:25px;color:var(--muted)}
@media(max-width:600px){
 header{padding:14px}
 main{margin:15px auto}
 .form-grid{grid-template-columns:1fr}
 .toolbar>*{flex:1}
 .month-label{min-width:100px}
}
</style>
</head>
<body>

<header>
  <h2>Employee Management</h2>
  <nav>
    <button class="nav-btn active" data-page="dashboard">Dashboard</button>
    <button class="nav-btn" data-page="attendance">Attendance</button>
    <button class="nav-btn" data-page="employees">Employees</button>
    <button class="nav-btn" data-page="history">History</button>
  </nav>
</header>

<main>
  <section id="dashboard" class="page active">
    <h2>Dashboard</h2>
    <div class="cards">
      <div class="card"><small>Total Employees</small><h2 id="totalEmployees">1</h2></div>
      <div class="card"><small>Present Today</small><h2 id="presentToday">0</h2></div>
      <div class="card"><small>Absent Today</small><h2 id="absentToday">0</h2></div>
      <div class="card"><small>Paid Leaves Used This Month</small><h2 id="leavesUsed">0</h2></div>
    </div>
    <div class="panel">
      <h3>Quick Actions</h3>
      <div class="toolbar">
        <button class="primary" data-page="attendance">Mark Attendance</button>
        <button data-page="employees">Manage Employee</button>
        <button data-action="salary">View Salary</button>
      </div>
    </div>
    <div class="panel">
      <h3>Employee Overview</h3>
      <div id="dashboardEmployee"></div>
    </div>
  </section>

  <section id="attendance" class="page">
    <h2>Attendance Management</h2>
    <div class="toolbar">
      <button data-action="prev-month">← Previous</button>
      <span class="month-label" id="attendanceMonth"></span>
      <button data-action="next-month">Next →</button>
      <button class="primary" data-action="salary">Calculate Salary</button>
    </div>
    <div class="panel">
      <div id="attendanceTable"></div>
    </div>
  </section>

  <section id="employees" class="page">
    <h2>Employee Details</h2>
    <div class="toolbar">
      <button class="primary" data-action="edit-employee">Edit Employee Details</button>
    </div>
    <div class="panel" id="employeeDetails"></div>
  </section>

  <section id="history" class="page">
    <h2>Attendance History</h2>
    <div class="toolbar">
      <button data-action="prev-month">← Previous</button>
      <span class="month-label" id="historyMonth"></span>
      <button data-action="next-month">Next →</button>
    </div>
    <div class="panel" id="historyTable"></div>
  </section>
</main>

<!-- Employee modal -->
<div class="modal" id="employeeModal">
  <div class="modal-box">
    <h2>Employee Details</h2>
    <div class="form-grid">
      <label>Employee Name<input id="formName" type="text"></label>
      <label>Employee ID<input id="formId" type="text"></label>
      <label>Date of Joining<input id="formDoj" type="date"></label>
      <label>Monthly Salary (₹)<input id="formSalary" type="number" min="0"></label>
      <label>Department<input id="formDepartment" type="text"></label>
      <label>Designation<input id="formDesignation" type="text"></label>
      <label>Contact Number<input id="formContact" type="tel"></label>
      <label>Status
        <select id="formStatus">
          <option>Active</option><option>Inactive</option>
        </select>
      </label>
    </div>
    <div class="modal-actions">
      <button data-action="close-employee">Cancel</button>
      <button class="primary" data-action="save-employee">Save Details</button>
    </div>
  </div>
</div>

<!-- Salary modal -->
<div class="modal" id="salaryModal">
  <div class="modal-box">
    <h2>Monthly Salary Details</h2>
    <div class="toolbar">
      <button data-action="prev-month">←</button>
      <span class="month-label" id="salaryMonth"></span>
      <button data-action="next-month">→</button>
    </div>
    <div id="salaryDetails"></div>
    <div class="modal-actions">
      <button data-action="close-salary">Close</button>
    </div>
  </div>
</div>

<script>
"use strict";

/* -------------------- DATA -------------------- */

const DEFAULT_EMPLOYEE = {
  name: "Employee Name",
  id: "EMP001",
  doj: "2026-08-05",
  salary: 15000,
  department: "General",
  designation: "Employee",
  contact: "",
  status: "Active"
};

let employee = load("employee", DEFAULT_EMPLOYEE);
let attendance = load("attendance", {});
let holidays = load("holidays", []);
let currentMonth = new Date();
currentMonth = new Date(currentMonth.getFullYear(), currentMonth.getMonth(), 1);

/* -------------------- STORAGE -------------------- */

function load(key, fallback) {
  try {
    const value = localStorage.getItem("employeeSystem_" + key);
    return value ? JSON.parse(value) : structuredClone(fallback);
  } catch (error) {
    return structuredClone(fallback);
  }
}

function save(key, value) {
  localStorage.setItem("employeeSystem_" + key, JSON.stringify(value));
}

function saveAll() {
  save("employee", employee);
  save("attendance", attendance);
  save("holidays", holidays);
}

/* -------------------- DATE HELPERS -------------------- */

function dateKey(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, "0");
  const d = String(date.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}

function parseDate(key) {
  const [y, m, d] = key.split("-").map(Number);
  return new Date(y, m - 1, d);
}

function monthKey(date = currentMonth) {
  return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,"0")}`;
}

function monthName(date = currentMonth) {
  return date.toLocaleString("en-IN", {month:"long",year:"numeric"});
}

function daysInMonth(date = currentMonth) {
  return new Date(date.getFullYear(), date.getMonth()+1, 0).getDate();
}

function isWeeklyOff(date) {
  if (date.getDay() === 0) return true;
  if (date.getDay() === 6) {
    const saturdayNumber = Math.ceil(date.getDate() / 7);
    return [1, 3, 5].includes(saturdayNumber);
  }
  return false;
}

function isHoliday(key) {
  return holidays.includes(key);
}

function isOffDay(date) {
  return isWeeklyOff(date) || isHoliday(dateKey(date));
}

function isAfterJoining(key) {
  return key >= employee.doj;
}

function getRecord(key) {
  return attendance[key] || (isOffDay(parseDate(key)) ? "WOFF" : "");
}

/* -------------------- NAVIGATION -------------------- */

function showPage(page) {
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));

  const target = document.getElementById(page);
  if (target) target.classList.add("active");

  document.querySelectorAll(`[data-page="${page}"]`).forEach(b => b.classList.add("active"));

  renderAll();
}

/* -------------------- ATTENDANCE -------------------- */

const attendanceOptions = [
  ["", "Select Status"],
  ["P", "Present"],
  ["A", "Absent"],
  ["HD", "Half Day"],
  ["PL", "Paid Leave"],
  ["UL", "Unpaid Leave"],
  ["WFH", "Work From Home"],
  ["COMOFF", "Comp Off"]
];

function renderAttendance() {
  document.getElementById("attendanceMonth").textContent = monthName();

  let html = `<table>
    <thead><tr><th>Date</th><th>Day</th><th>Attendance Status</th></tr></thead><tbody>`;

  const total = daysInMonth();

  for (let day = 1; day <= total; day++) {
    const date = new Date(currentMonth.getFullYear(), currentMonth.getMonth(), day);
    const key = dateKey(date);

    if (!isAfterJoining(key)) continue;

    const off = isOffDay(date);
    const savedStatus = attendance[key] || (off ? "WOFF" : "");
    const locked = off && !attendance[key];

    html += `<tr>
      <td>${date.toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"})}</td>
      <td>${date.toLocaleDateString("en-IN",{weekday:"long"})}</td>
      <td>`;

    if (locked) {
      html += `<span class="badge">${isHoliday(key) ? "HOLIDAY" : "WEEKLY OFF"}</span>`;
    } else {
      html += `<select class="attendance-select" data-date="${key}">
        ${attendanceOptions.map(([value,label]) =>
          `<option value="${value}" ${savedStatus===value?"selected":""}>${label}</option>`
        ).join("")}
        <option value="WOFF" ${savedStatus==="WOFF"?"selected":""}>Weekly Off</option>
      </select>`;
    }

    html += `</td></tr>`;
  }

  html += "</tbody></table>";
  document.getElementById("attendanceTable").innerHTML = html;
}

function updateAttendance(key, status) {
  const date = parseDate(key);

  if (!isAfterJoining(key)) {
    alert("Attendance cannot be marked before the joining date.");
    return;
  }

  if (status === "COMOFF" && isOffDay(date)) {
    alert("Comp Off can only be used on a working day.");
    renderAll();
    return;
  }

  if (status === "PL") {
    const used = paidLeavesUsed(monthKey(date));
    if (used >= 2 && attendance[key] !== "PL") {
      alert("You have already used 2 paid leaves this month.");
      renderAll();
      return;
    }
  }

  if (status === "WOFF" && !isOffDay(date)) {
    alert("Weekly Off can only be marked on an eligible weekly off or holiday.");
    renderAll();
    return;
  }

  if (status === "") delete attendance[key];
  else attendance[key] = status;

  save("attendance", attendance);
  renderAll();
}

function paidLeavesUsed(month) {
  return Object.entries(attendance).filter(([key, value]) =>
    key.startsWith(month) && value === "PL"
  ).length;
}

/* -------------------- COMPOFF -------------------- */

function compOffBalance() {
  let balance = 0;
  const keys = Object.keys(attendance).sort();

  keys.forEach(key => {
    const status = attendance[key];
    const date = parseDate(key);

    if (isOffDay(date) && ["P","WFH"].includes(status)) balance++;
    if (!isOffDay(date) && status === "COMOFF") balance--;
  });

  return Math.max(0, balance);
}

/* -------------------- SALARY -------------------- */

function calculateSalary(date = currentMonth) {
  const totalDays = daysInMonth(date);
  const first = new Date(date.getFullYear(), date.getMonth(), 1);
  const last = new Date(date.getFullYear(), date.getMonth()+1, 0);

  const joining = parseDate(employee.doj);
  const eligibleStart = joining > first ? joining : first;

  if (eligibleStart > last) {
    return {
      totalDays, eligibleDays:0, base:0, absent:0,
      half:0, unpaid:0, deductions:0, net:0
    };
  }

  let eligibleDays = 0;
  let absent = 0;
  let half = 0;
  let unpaid = 0;

  for (let day = eligibleStart.getDate(); day <= totalDays; day++) {
    const current = new Date(date.getFullYear(), date.getMonth(), day);
    const key = dateKey(current);
    const status = attendance[key] || (isOffDay(current) ? "WOFF" : "");

    eligibleDays++;

    if (status === "A") absent++;
    if (status === "HD") half++;
    if (status === "UL") unpaid++;
  }

  const dailySalary = Number(employee.salary || 0) / totalDays;
  const base = dailySalary * eligibleDays;
  const deductions = dailySalary * (absent + unpaid + half * 0.5);
  const net = Math.max(0, base - deductions);

  return {
    totalDays, eligibleDays, base, absent, half, unpaid, deductions, net
  };
}

function rupees(value) {
  return "₹" + Number(value).toLocaleString("en-IN", {
    minimumFractionDigits:2,
    maximumFractionDigits:2
  });
}

function renderSalary() {
  document.getElementById("salaryMonth").textContent = monthName();

  const s = calculateSalary();

  document.getElementById("salaryDetails").innerHTML = `
    <div class="summary-line"><span>Employee</span><strong>${escapeHTML(employee.name)}</strong></div>
    <div class="summary-line"><span>Monthly Fixed Salary</span><strong>${rupees(employee.salary)}</strong></div>
    <div class="summary-line"><span>Calendar Days in Month</span><strong>${s.totalDays}</strong></div>
    <div class="summary-line"><span>Eligible Days from Joining</span><strong>${s.eligibleDays}</strong></div>
    <div class="summary-line"><span>Prorated Salary</span><strong>${rupees(s.base)}</strong></div>
    <div class="summary-line"><span>Absent Days</span><strong>${s.absent}</strong></div>
    <div class="summary-line"><span>Half Days</span><strong>${s.half}</strong></div>
    <div class="summary-line"><span>Unpaid Leaves</span><strong>${s.unpaid}</strong></div>
    <div class="summary-line"><span>Total Deductions</span><strong>${rupees(s.deductions)}</strong></div>
    <div class="summary-line total"><span>Net Salary</span><strong>${rupees(s.net)}</strong></div>
    <div class="summary-line"><span>Paid Leaves Used</span><strong>${paidLeavesUsed(monthKey())} / 2</strong></div>
    <div class="summary-line"><span>Comp Off Balance</span><strong>${compOffBalance()}</strong></div>
    <p class="muted">Salary is calculated using the actual calendar days in the selected month. Sundays and 1st, 3rd and 5th Saturdays are weekly offs. Declared holidays are also treated as weekly offs.</p>
  `;
}

/* -------------------- EMPLOYEE DETAILS -------------------- */

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  }[char]));
}

function renderEmployee() {
  document.getElementById("employeeDetails").innerHTML = `
    <div class="summary-line"><span>Name</span><strong>${escapeHTML(employee.name)}</strong></div>
    <div class="summary-line"><span>Employee ID</span><strong>${escapeHTML(employee.id)}</strong></div>
    <div class="summary-line"><span>Date of Joining</span><strong>${escapeHTML(employee.doj)}</strong></div>
    <div class="summary-line"><span>Monthly Salary</span><strong>${rupees(employee.salary)}</strong></div>
    <div class="summary-line"><span>Department</span><strong>${escapeHTML(employee.department)}</strong></div>
    <div class="summary-line"><span>Designation</span><strong>${escapeHTML(employee.designation)}</strong></div>
    <div class="summary-line"><span>Contact</span><strong>${escapeHTML(employee.contact)}</strong></div>
    <div class="summary-line"><span>Employment Status</span><strong>${escapeHTML(employee.status)}</strong></div>
  `;
}

function openEmployeeModal() {
  document.getElementById("formName").value = employee.name;
  document.getElementById("formId").value = employee.id;
  document.getElementById("formDoj").value = employee.doj;
  document.getElementById("formSalary").value = employee.salary;
  document.getElementById("formDepartment").value = employee.department;
  document.getElementById("formDesignation").value = employee.designation;
  document.getElementById("formContact").value = employee.contact;
  document.getElementById("formStatus").value = employee.status;

  document.getElementById("employeeModal").classList.add("show");
}

function saveEmployee() {
  const name = document.getElementById("formName").value.trim();
  const id = document.getElementById("formId").value.trim();
  const doj = document.getElementById("formDoj").value;
  const salary = Number(document.getElementById("formSalary").value);

  if (!name || !id || !doj || !Number.isFinite(salary) || salary < 0) {
    alert("Please enter a valid name, employee ID, joining date and salary.");
    return;
  }

  employee = {
    name,
    id,
    doj,
    salary,
    department: document.getElementById("formDepartment").value.trim(),
    designation: document.getElementById("formDesignation").value.trim(),
    contact: document.getElementById("formContact").value.trim(),
    status: document.getElementById("formStatus").value
  };

  save("employee", employee);
  document.getElementById("employeeModal").classList.remove("show");
  renderAll();
}

/* -------------------- HISTORY -------------------- */

function renderHistory() {
  document.getElementById("historyMonth").textContent = monthName();

  const rows = Object.entries(attendance)
    .filter(([key]) => key.startsWith(monthKey()))
    .sort(([a],[b]) => a.localeCompare(b));

  if (!rows.length) {
    document.getElementById("historyTable").innerHTML =
      '<div class="empty">No attendance records for this month.</div>';
    return;
  }

  let html = `<table><thead><tr><th>Date</th><th>Day</th><th>Status</th></tr></thead><tbody>`;

  rows.forEach(([key,status]) => {
    const date = parseDate(key);
    const label = attendanceOptions.find(o => o[0] === status)?.[1] || status;
    html += `<tr>
      <td>${key}</td>
      <td>${date.toLocaleDateString("en-IN",{weekday:"long"})}</td>
      <td>${escapeHTML(label)}</td>
    </tr>`;
  });

  html += "</tbody></table>";
  document.getElementById("historyTable").innerHTML = html;
}

/* -------------------- DASHBOARD -------------------- */

function renderDashboard() {
  const today = dateKey(new Date());
  const todayStatus = attendance[today] || "";

  document.getElementById("totalEmployees").textContent =
    employee.status === "Active" ? "1" : "0";

  document.getElementById("presentToday").textContent =
    ["P","WFH"].includes(todayStatus) ? "1" : "0";

  document.getElementById("absentToday").textContent =
    todayStatus === "A" ? "1" : "0";

  document.getElementById("leavesUsed").textContent =
    paidLeavesUsed(month
